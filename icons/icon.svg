<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />
  
  <!-- Outer pulse ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="4" stroke-dasharray="12 12" />
  
  <!-- Lightning bolt symbol -->
  <path d="M 280 90 L 150 280 L 250 280 L 230 422 L 362 232 L 262 232 Z" fill="url(#bolt)" filter="url(#glow)" />
</svg>
