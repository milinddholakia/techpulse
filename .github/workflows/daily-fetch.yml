name: Daily 6:00 AM News Fetcher

on:
  schedule:
    # Runs at 00:30 UTC every day (6:00 AM IST) or adjust to your local timezone
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch 20-25 Latest Tech & AI News
        run: |
          python3 fetch_news.py

      - name: Commit and Push Updated news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TechPulse Bot"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fetch daily 6:00 AM news feed [skip ci]" && git push)
